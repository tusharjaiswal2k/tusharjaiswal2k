<svg xmlns="http://www.w3.org/2000/svg" width="600" height="640" viewBox="0 0 600 640" role="img" aria-labelledby="title description">
  <title id="title">Production impact</title>
  <desc id="description">A mobile layout showing four outcomes from Tushar Jaiswal's engineering work.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1516" />
      <stop offset="1" stop-color="#102020" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#9ad8cf" stroke-opacity="0.035" />
    </pattern>
    <clipPath id="frame"><rect width="600" height="640" rx="20" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="600" height="640" fill="url(#background)" />
    <rect width="600" height="640" fill="url(#grid)" />
    <line x1="28" y1="160" x2="572" y2="160" stroke="#2b4441" />
    <line x1="28" y1="320" x2="572" y2="320" stroke="#2b4441" />
    <line x1="28" y1="480" x2="572" y2="480" stroke="#2b4441" />

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <g transform="translate(32 30)">
        <text x="0" y="70" fill="#edf6f4" font-size="56" font-weight="760">200+</text>
        <text x="185" y="53" fill="#b9cbc7" font-size="25" font-weight="680">merchants served daily</text>
        <text x="185" y="85" fill="#809b96" font-size="18">Multi-channel production platform</text>
      </g>

      <g transform="translate(32 190)">
        <text x="0" y="70" fill="#70c9bc" font-size="56" font-weight="760">100%</text>
        <text x="185" y="53" fill="#b9cbc7" font-size="25" font-weight="680">analytics traffic migrated</text>
        <text x="185" y="85" fill="#809b96" font-size="18">PostgreSQL → ClickHouse</text>
      </g>

      <g transform="translate(32 350)">
        <text x="0" y="70" fill="#70c9bc" font-size="56" font-weight="760">~40%</text>
        <text x="185" y="53" fill="#b9cbc7" font-size="25" font-weight="680">lower database cost</text>
        <text x="185" y="85" fill="#809b96" font-size="18">After analytical workload isolation</text>
      </g>

      <g transform="translate(32 510)">
        <text x="0" y="70" fill="#edf6f4" font-size="56" font-weight="760">100+</text>
        <text x="185" y="53" fill="#b9cbc7" font-size="25" font-weight="680">drone missions supported</text>
        <text x="185" y="85" fill="#809b96" font-size="18">10+ concurrent flights</text>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="598.5" height="638.5" rx="19.25" fill="none" stroke="#35504d" stroke-width="1.5" />
</svg>
