            <text x="37" y="27" text-anchor="middle" fill="#7f9692" font-size="11" font-weight="700" letter-spacing="1">FAST</text>
            <text x="37" y="44" text-anchor="middle" fill="#c9d7d5" font-size="14">Cache</text>
          </g>

