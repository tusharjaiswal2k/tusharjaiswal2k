<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Tushar Jaiswal - Backend Software Engineer</title>
  <desc id="desc">A dark three-dimensional systems architecture banner with APIs, queues, caching, and databases.</desc>
  <defs>
