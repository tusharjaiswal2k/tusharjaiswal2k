<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Tushar Jaiswal — Backend Software Engineer</title>
  <desc id="description">A restrained production-systems banner showing Tushar Jaiswal's name beside a backend service topology.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
